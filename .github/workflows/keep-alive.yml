# Pings the Render free web service so it doesn't spin down after
# 15 minutes without inbound traffic.
name: Keep Render awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          # Override with a repo variable if the Render URL changes.
          APP_URL: ${{ vars.RENDER_APP_URL || 'https://tourrific-iowv.onrender.com' }}
        # A sleeping instance can take a minute to wake, so allow a long
        # timeout and a few retries.
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            "$APP_URL/api/health"
