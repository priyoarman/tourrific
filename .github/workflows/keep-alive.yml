name: Keep Render awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          APP_URL: ${{ vars.RENDER_APP_URL || 'https://tourrific-iowv.onrender.com' }}
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            "$APP_URL/api/health"
