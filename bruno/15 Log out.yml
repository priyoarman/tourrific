info:
  name: Log out
  type: http
  seq: 15

http:
  method: POST
  url: http://localhost:3000/api/auth/logout
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Removes the session cookie. The requests that need a login answer 401 until you log in again.
