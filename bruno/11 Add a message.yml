info:
  name: Add a message
  type: http
  seq: 11

http:
  method: POST
  url: http://localhost:3000/api/conversations/{{conversation_id}}/messages
  body:
    type: json
    data: |-
      {
        "senderRole": "user",
        "textContent": "Copenhagen to London next Friday"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  senderRole is "user" or "assistant".
