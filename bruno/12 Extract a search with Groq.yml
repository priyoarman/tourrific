info:
  name: Extract a search with Groq
  type: http
  seq: 12

http:
  method: POST
  url: http://localhost:3000/api/groq/extract
  body:
    type: json
    data: |-
      {
        "prompt": "Find direct return flights from Copenhagen to Barcelona for 2 passengers from 2027-07-15 to 2027-07-22 under 2500 DKK with baggage included."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Shows the structured search Groq reads out of a sentence, without searching. Spends Groq quota.
