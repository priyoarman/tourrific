info:
  name: Verify token
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/api/auth/verify
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 while the token is valid, 401 once it has expired.
