info:
  name: List messages
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:3000/api/conversations/{{conversation_id}}/messages
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Messages of your conversation, oldest first. 404 for someone else's conversation.
