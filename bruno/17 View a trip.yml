info:
  name: View a trip
  type: http
  seq: 17

http:
  method: GET
  url: http://localhost:3000/api/trips/{{trip_id}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  One trip, for anyone with its id. `owner` is "you", "someone-else", or null when nobody has saved it yet. 404 for an unknown id.
