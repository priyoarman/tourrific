info:
  name: Log in
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/auth/login
  body:
    type: json
    data: |-
      {
        "email": "traveller@example.com",
        "password": "testpass123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Signs in: the answer sets a `session` cookie that lasts 1 hour, which is kept in the cookie jar and sent with the other requests. The token is in that cookie only, not in the body.

  429 (with a Retry-After header) after 10 login attempts from one IP address in 15 minutes, right or wrong.

  Example 429 body:

      {"success": false, "message": "Too many login attempts. Please try again in 15 minutes.", "retryAfterSeconds": 900}
