info:
  name: Sign up
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/auth/signup
  body:
    type: json
    data: |-
      {
        "name": "Test Traveller",
        "email": "traveller@example.com",
        "password": "testpass123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates an account. It does not sign in: log in next. 409 if the email is taken.

  429 (with a Retry-After header) after 5 sign-up attempts from one IP address in a day.

  Example 429 body:

      {"success": false, "message": "Too many sign-ups from this network today. Please try again tomorrow.", "retryAfterSeconds": 86400}
