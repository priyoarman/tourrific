  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.id) bru.setVar("trip_id", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Stores a flight and a hotel picked together and stores the trip's id in `trip_id`. Works without logging in; a logged-in user owns the trip from the start. The stay must fit the flight: check-in on the day it leaves, check-out on the day the return leaves. 429 after too many trips in a day.
