            "destination": "LIS",
            "departureTime": "2026-11-12T08:30:00",
            "arrivalTime": "2026-11-12T11:15:00",
            "durationMinutes": 285,
            "stops": []
          },
          "inbound": {
            "origin": "LIS",
            "destination": "CPH",
            "departureTime": "2026-11-16T12:40:00",
            "arrivalTime": "2026-11-16T19:05:00",
            "durationMinutes": 325,
            "stops": [
              {
                "airport": "AMS",
