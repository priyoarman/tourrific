info:
  name: Current conversation
  type: http
  seq: 9

http:
  method: GET
  url: http://localhost:3000/api/conversations/current
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("conversation_id", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The logged-in user's conversation, created on first use. Stores its id in `conversation_id`.
